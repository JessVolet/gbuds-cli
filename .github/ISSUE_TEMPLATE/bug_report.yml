name: Bug report
description: Report a reproducible Gbuds issue
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Report issues with Gbuds here. Do not include Bluetooth addresses, earbud/case serial numbers, pairing details, or unredacted packet captures.
  - type: input
    id: version
    attributes:
      label: Gbuds version
      description: Release version or Git commit.
      placeholder: 0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Earbuds model and code
      description: For example, Galaxy Buds FE (SM-R400N).
    validations:
      required: false
  - type: input
    id: firmware
    attributes:
      label: Firmware version
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: Linux distribution and Python version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and transport
      description: Include the command and transport used. Redact addresses and serial numbers.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted output
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true

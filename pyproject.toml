[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gbuds"
version = "0.1.0"
description = "Headless CLI and library for Samsung Galaxy Buds on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "JessVolet" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JessVolet/gbuds-cli"
Repository = "https://github.com/JessVolet/gbuds-cli.git"
Issues = "https://github.com/JessVolet/gbuds-cli/issues"

[project.scripts]
gbuds = "gbuds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

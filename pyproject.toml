[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "gbuds"
version = "0.1.0b1"
description = "Headless CLI and library for Samsung Galaxy Buds on Linux"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["samsung", "galaxy-buds", "bluetooth", "rfcomm", "linux", "cli"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "JessVolet" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JessVolet/gbuds-cli"
Repository = "https://github.com/JessVolet/gbuds-cli.git"
Issues = "https://github.com/JessVolet/gbuds-cli/issues"
Documentation = "https://github.com/JessVolet/gbuds-cli/tree/main/docs"
Changelog = "https://github.com/JessVolet/gbuds-cli/blob/main/CHANGELOG.md"
Security = "https://github.com/JessVolet/gbuds-cli/security/policy"

[project.scripts]
gbuds = "gbuds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
